<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Explore Kumanovo</title>

  <script>
    const android =
      "https://play.google.com/store/apps/details?id=com.explorekumanovo.app";

    const ios =
      "https://apps.apple.com/app/explore-kumanovo/id6806411940";

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.replace(android);
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(ios);
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
    }

    a {
      display: block;
      background: #111;
      color: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Explore Kumanovo</h1>

    <p>Преземи ја апликацијата бесплатно</p>

    <a href="https://apps.apple.com/app/explore-kumanovo/id6806411940">
      Download on the App Store
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.explorekumanovo.app">
      Get it on Google Play
    </a>
  </div>

</body>
</html>
